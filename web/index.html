<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ConnectMe — a personal communication app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="connectme">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>connectme</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Dev-only auto-reload: polls main.dart.js for a new build (by
    Last-Modified) and reloads the page when one lands, so a rebuild shows up
    on every open tab/phone without a manual refresh. Safe to leave in — it's
    a couple of HEAD requests a second, nothing else.
  -->
  <script>
    (function () {
      var lastSeen = null;
      setInterval(function () {
        fetch('main.dart.js', { method: 'HEAD', cache: 'no-store' })
          .then(function (res) {
            var stamp = res.headers.get('last-modified') || res.headers.get('etag');
            if (!stamp) return;
            if (lastSeen === null) {
              lastSeen = stamp;
            } else if (stamp !== lastSeen) {
              location.reload();
            }
          })
          .catch(function () {});
      }, 1500);
    })();
  </script>
</body>
</html>
